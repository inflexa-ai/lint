name: Scorecard

# Runs OpenSSF Scorecard and publishes the result to the public OpenSSF API that
# backs the README badge. The repository is public, and the API stores the score,
# not the source.
#
# The actions are pinned by commit SHA because this job holds `id-token: write`
# and `security-events: write`: a hijacked mutable tag here has the highest
# impact. Keep the version comment on each `uses:` in sync when you bump it.
on:
  # Scorecard publishes only from the default branch, and fork PRs get no OIDC token.
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Without `repo_token`, the Branch-Protection check sees only part of the
      # rulesets and scores lower. A PAT would fix the score, but a long-lived
      # secret in the repository is a worse posture than the score reports.
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          sarif_file: results.sarif
