name: Test

# Each package job runs only when the pull request changes that package,
# docs/rules/ (the tests of both packages read it), or this file. A job skips
# through `if`, never through `paths`: a required check of a skipped workflow
# stays pending and blocks the merge, while a skipped job reports success. If
# `changes` fails, its outputs are empty, thus both package jobs run.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Find the changed packages
    runs-on: ubuntu-latest
    outputs:
      oxlint: ${{ steps.diff.outputs.oxlint }}
      golint: ${{ steps.diff.outputs.golint }}
    steps:
      # The merge commit of the pull request and its first parent, the tip of the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        shell: bash
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          for package in oxlint golint; do
            if grep -qE "^(${package}/|docs/rules/|\.github/workflows/test\.yml$)" <<<"$changed"; then
              echo "${package}=true" >>"$GITHUB_OUTPUT"
            else
              echo "${package}=false" >>"$GITHUB_OUTPUT"
            fi
          done
  test:
    name: Format, lint and test at oxlint/
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.oxlint != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: oxlint/package-lock.json
      - name: npm ci
        working-directory: oxlint
        run: npm ci
      - name: npm run format:check
        working-directory: oxlint
        run: npm run format:check
      - name: npm run lint
        working-directory: oxlint
        run: npm run lint
      - name: npm test
        working-directory: oxlint
        run: npm test
  golint:
    name: Format, vet and test at golint/
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.golint != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golint/go.mod
          cache-dependency-path: golint/go.sum
      - name: gofmt -l
        working-directory: golint
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: golint
        run: go vet ./...
      - name: go test
        working-directory: golint
        run: go test -count=1 ./...
